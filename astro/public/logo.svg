<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 144" fill="none">
  <!-- Drop shadow -->
  <path d="M60 6 L113 27 L113 82 Q113 118 60 138 Q7 118 7 82 L7 27 Z"
        fill="#000" opacity="0.25" transform="translate(1.5,2.5)"/>

  <!-- Shield body -->
  <path d="M60 6 L113 27 L113 82 Q113 118 60 138 Q7 118 7 82 L7 27 Z"
        fill="#12284C"/>

  <!-- Gold border -->
  <path d="M60 6 L113 27 L113 82 Q113 118 60 138 Q7 118 7 82 L7 27 Z"
        fill="none" stroke="#F3BD48" stroke-width="3.5"/>

  <!-- Gold top band -->
  <path d="M60 6 L113 27 L113 50 L7 50 L7 27 Z"
        fill="#F3BD48"/>

  <!-- Chalky blue horizontal stripe -->
  <rect x="7" y="86" width="106" height="18" fill="#3F96B4"/>

  <!-- Gold band dividers -->
  <line x1="7" y1="50" x2="113" y2="50" stroke="#12284C" stroke-width="1.5"/>
  <line x1="7" y1="86" x2="113" y2="86" stroke="#F3BD48" stroke-width="1.5"/>
  <line x1="7" y1="104" x2="113" y2="104" stroke="#F3BD48" stroke-width="1.5"/>

  <!-- "EST. 2026" in top gold band -->
  <text x="60" y="41" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif"
        font-size="11" font-weight="800" text-anchor="middle"
        fill="#12284C" letter-spacing="2">EST. 2026</text>

  <!-- RFC initials — main element -->
  <text x="60" y="82" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif"
        font-size="34" font-weight="900" text-anchor="middle"
        fill="#F3BD48" letter-spacing="3">RFC</text>

  <!-- RIVERSIDE FC in blue stripe -->
  <text x="60" y="97.5" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif"
        font-size="9.5" font-weight="800" text-anchor="middle"
        fill="#fff" letter-spacing="2">RIVERSIDE FC</text>

  <!-- Light blue ball/star accents in lower shield -->
  <circle cx="36" cy="120" r="4" fill="#3F96B4" opacity="0.5"/>
  <circle cx="60" cy="125" r="4" fill="#3F96B4" opacity="0.5"/>
  <circle cx="84" cy="120" r="4" fill="#3F96B4" opacity="0.5"/>
</svg>
